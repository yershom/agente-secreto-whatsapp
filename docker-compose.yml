version: '3.8'

services:
  agente-wa:
    build: .
    container_name: agente-wa
    restart: always
    volumes:
      - ./conversations:/app/conversations
      - ./auth_info:/app/auth_info
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    networks:
      - agente-network

  caddy:
    image: caddy:2-alpine
    container_name: caddy-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - agente-network
    environment:
      - ACME_AGREE=true

networks:
  agente-network:
    driver: bridge
