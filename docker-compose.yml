services:
  agente-wa:
    build: .
    container_name: agente-wa
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Bind mounts para almacenamiento persistente en el host
      # Las conversaciones se guardan en /home/ubuntu/AgenteWA/agente-secreto-whatsapp/conversations
      - ./conversations:/app/conversations
      - ./auth_info:/app/auth_info
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
