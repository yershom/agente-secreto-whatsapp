services:
  agente-wa:
    build: .
    container_name: agente-wa
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Bind mounts para almacenamiento persistente en el host
      # Para cambiar de teléfono: editar CONVERSATIONS_DIR y AUTH_DIR en .env y reiniciar
      - ${CONVERSATIONS_DIR:-./conversations}:/app/conversations
      - ${AUTH_DIR:-./auth_info}:/app/auth_info
      - ./logs:/app/logs
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
